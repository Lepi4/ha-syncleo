name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.7.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint and type check
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run mypy custom_components/syncleo/ --check-untyped-defs
      - name: Run offline recovery regressions
        run: uv run python -m unittest discover -s tests -v
      - name: Build and verify Marketplace archive
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git rev-parse --verify "refs/tags/$TAG"
          test -f "docs/releases/${TAG#v}.md"
          uv run python scripts/build_release.py --version "$TAG"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/syncleo.zip dist/SHA256SUMS \
            --verify-tag --draft --title "Syncleo ${TAG#v}" \
            --notes-file "docs/releases/${TAG#v}.md"
          gh release edit "$TAG" --draft=false --latest
