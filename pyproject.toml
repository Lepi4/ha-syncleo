[project]
name = "ha-syncleo"
version = "0.7.1"
description = "A Home Assistant integration to control devices using Syncleo IoT (Rusclimate/Polaris)"
readme = "README.md"
authors = [
    { name = "DeKaN" }
]
requires-python = ">=3.14.2"
dependencies = [
    "pysyncleo==0.4.1",
]

[project.urls]
Repository = "https://github.com/Lepi4/ha-syncleo"
Issues = "https://github.com/Lepi4/ha-syncleo/issues"

[dependency-groups]
dev = [
    "homeassistant-stubs>=2026.10.0",
    "mypy==1.20.2",
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
]
[tool.mypy]
python_version = "3.14"
platform = "linux"
follow_imports = "normal"
ignore_missing_imports = true
check_untyped_defs = true
